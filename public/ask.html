<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ask Huddle</title>
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      body { margin: 0; }
      .ask {
        display: flex;
        flex-direction: column;
        height: 100vh;
        max-width: 720px;
        margin: 0 auto;
      }
      .ask-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--hairline);
        font-weight: 800;
      }
      .ask-head .brand-mark { color: var(--coral); }
      .ask-head .tag {
        margin-left: auto;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-faint);
      }
      .ask-log {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .bubble {
        max-width: 92%;
        padding: 10px 14px;
        border-radius: 16px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .bubble.me {
        align-self: flex-end;
        background: var(--coral);
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .bubble.bot {
        align-self: flex-start;
        background: var(--surface-sunk);
        border-bottom-left-radius: 4px;
      }
      .bubble .srcs {
        display: block;
        margin-top: 8px;
        font-size: 13px;
      }
      .bubble .srcs a {
        color: var(--link);
        display: block;
        text-decoration: none;
        margin-top: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .empty {
        color: var(--ink-muted);
        text-align: center;
        margin: auto;
        padding: 24px;
        max-width: 34ch;
      }
      .ask-form {
        display: flex;
        gap: 8px;
        padding: 12px 16px;
        border-top: 1px solid var(--hairline);
      }
      .ask-form input {
        flex: 1;
        padding: 12px 14px;
        border: 1px solid var(--hairline);
        border-radius: var(--r-input, 14px);
        background: var(--surface);
        color: var(--ink);
        font: inherit;
      }
      .ask-form button {
        padding: 0 18px;
        border: 0;
        border-radius: var(--r-input, 14px);
        background: var(--coral);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      .ask-form button:disabled { opacity: 0.5; cursor: default; }
      .typing { color: var(--ink-faint); font-style: italic; }
    </style>
  </head>
  <body>
    <div class="ask">
      <header class="ask-head">
        <span class="brand-mark" aria-hidden="true">◍</span> Ask Huddle
        <span class="tag" id="mode">web</span>
      </header>
      <div class="ask-log" id="log">
        <p class="empty">
          Ask me anything — I search the web for current stuff (scores, prices, news) and answer
          with sources. Handy during a meeting: keep me open and settle a question on the spot.
        </p>
      </div>
      <form class="ask-form" id="form">
        <input id="q" placeholder="e.g. what's the current USD to EUR rate?" autocomplete="off" maxlength="2000" />
        <button id="send" type="submit">Ask</button>
      </form>
    </div>

    <script type="module">
      // If this page is embedded as a Google Meet side-panel add-on, initialize
      // the Meet session so the add-on loading screen dismisses. Best-effort: if
      // we're not inside Meet (or the SDK can't load), it just runs as a normal
      // web page. The project number is public.
      (async () => {
        try {
          const { meet } = await import('https://esm.sh/@googleworkspace/meet-addons/meet.addons');
          const session = await meet.addon.createAddonSession({ cloudProjectNumber: '348219080732' });
          await session.createSidePanelClient();
          document.getElementById('mode').textContent = 'in meeting';
        } catch {
          /* standalone browser tab — nothing to do */
        }
      })();

      const log = document.getElementById('log');
      const form = document.getElementById('form');
      const input = document.getElementById('q');
      const send = document.getElementById('send');
      const history = []; // recent turns, sent as context

      const esc = (s) =>
        String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

      function bubble(cls, html) {
        const empty = log.querySelector('.empty');
        if (empty) empty.remove();
        const el = document.createElement('div');
        el.className = `bubble ${cls}`;
        el.innerHTML = html;
        log.appendChild(el);
        log.scrollTop = log.scrollHeight;
        return el;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const q = input.value.trim();
        if (!q) return;
        input.value = '';
        send.disabled = true;
        bubble('me', esc(q));
        const thinking = bubble('bot typing', 'searching…');

        try {
          const res = await fetch('/api/ask', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ question: q, context: history.slice(-4).join('\n') }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Something went wrong.');
          const srcs = (data.sources || [])
            .slice(0, 3)
            .map((s) => `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a>`)
            .join('');
          thinking.className = 'bubble bot';
          thinking.innerHTML = esc(data.text) + (srcs ? `<span class="srcs">${srcs}</span>` : '');
          history.push(`Q: ${q}`, `A: ${data.text}`);
        } catch (err) {
          thinking.className = 'bubble bot';
          thinking.textContent = err.message;
        } finally {
          send.disabled = false;
          input.focus();
        }
      });
    </script>
  </body>
</html>
