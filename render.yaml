# Render blueprint — one-click deploy for the web app.
#
# Why a host and not GitHub Pages: this is a Node server, not a static site.
# The frontend calls /api/* routes served by src/server.mjs, and group state
# has to be shared between everyone in a huddle. Static hosting can do neither.
#
# Deploy:
#   1. render.com -> New -> Blueprint -> connect this repo
#   2. Add ANTHROPIC_API_KEY in the dashboard (never commit it)
#
# Note: the free plan sleeps after ~15 min idle (first hit takes ~30s to wake)
# and has an ephemeral filesystem, so data/huddles.sqlite is wiped on redeploy.
# Attach a persistent disk (paid plans) and point HUDDLE_DATA_DIR at its mount
# path to keep plans across deploys.
services:
  - type: web
    name: huddle
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Set this in the Render dashboard, not here. sync:false keeps it
      # out of the repo and prompts you for it at deploy time.
      - key: ANTHROPIC_API_KEY
        sync: false
      # node:sqlite (the store) needs 22.5+; pin to 24 so it's never in doubt.
      - key: NODE_VERSION
        value: "24"
      # Absolute origin for share links, og:url and rel=canonical. Without it
      # links pasted into WhatsApp/iMessage point at localhost.
      - key: HUDDLE_PUBLIC_URL
        value: https://huddle-hq.com
